plugins {
    id "net.fabricmc.fabric-loom" version "1.19.3"
    id "java"
}
version = project.mod_version
group = project.maven_group
base { archivesName = "NFCC-NetherFortressCrossingCalculator" }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
